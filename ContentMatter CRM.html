<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ContentMatter CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap">
<style>
/* content MATTER tokens, generated from the Design System tokens.json. Do not edit by hand. */
:root{--surface:#F5F2EA;--surface-raised:#FFFFFF;--surface-panel:#ECE7DA;--surface-inverse:#2C3340;--ink:#2C3340;--ink-muted:#5B6270;--ink-inverse:#F5F2EA;--hairline:#DDD7C9;--border-control:#7E8796;--brand:#3CBFB0;--brand-hover:#6BD0C4;--on-brand:#2C3340;--accent-text:#1A7A6E;--accent-on-inverse:#3CBFB0;--focus-ring:#1A7A6E;--status-good:#176C62;--status-good-tint:#DDF2EF;--status-warning:#8A5A0B;--status-warning-tint:#F7EBD3;--status-poor:#B0463A;--status-poor-tint:#F8E3DF;--status-info:#2C3340;--status-info-tint:#E4E7EC;--status-dot-good:#3CBFB0;--status-dot-warning:#E8B45C;--status-dot-poor:#E07A6A;--status-dot-info:#2C3340;--chart-1:#3CBFB0;--chart-2:#2C3340;--chart-3:#E8B45C;--chart-4:#E07A6A;--teal:#3CBFB0;--teal-600:#2A9D8F;--teal-700:#1A7A6E;--navy:#2C3340;--cream:#F5F2EA;--white:#FFFFFF;--black:#000000;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;--space-16:64px;--space-24:96px;--radius-xs:2px;--radius-sm:4px;--radius-md:8px;--radius-lg:16px;--radius-pill:9999px;--stroke-hairline:1px;--stroke-control:1.5px;--stroke-rule:4px;--stroke-wordmark:8px;--content-max:1080px;--read-max:680px;--control-height:48px;--icon-md:20px;--font-sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surface:#2C3340;--surface-raised:#363E4D;--surface-panel:#323A48;--surface-inverse:#222833;--ink:#F5F2EA;--ink-muted:#B7BDC8;--ink-inverse:#F5F2EA;--hairline:#444D5C;--border-control:#8790A0;--accent-text:#3CBFB0;--focus-ring:#3CBFB0;--status-good:#3CBFB0;--status-good-tint:#24464A;--status-warning:#E8B45C;--status-warning-tint:#4A4232;--status-poor:#F0907F;--status-poor-tint:#4D3A3D;--status-info:#A9C3E8;--status-info-tint:#3A4558;--status-dot-info:#A9C3E8;--chart-2:#C9D3E0;color-scheme:dark}}
:root[data-theme="dark"]{--surface:#2C3340;--surface-raised:#363E4D;--surface-panel:#323A48;--surface-inverse:#222833;--ink:#F5F2EA;--ink-muted:#B7BDC8;--ink-inverse:#F5F2EA;--hairline:#444D5C;--border-control:#8790A0;--accent-text:#3CBFB0;--focus-ring:#3CBFB0;--status-good:#3CBFB0;--status-good-tint:#24464A;--status-warning:#E8B45C;--status-warning-tint:#4A4232;--status-poor:#F0907F;--status-poor-tint:#4D3A3D;--status-info:#A9C3E8;--status-info-tint:#3A4558;--status-dot-info:#A9C3E8;--chart-2:#C9D3E0;color-scheme:dark}
/* ContentMatter CRM. Internal agency workspace on the content MATTER Design System:
   AppShell frame, MetricCard tiles, ContentStatus pills, sharp 4px cards, flat, Inter 400/700/900. */
:root{
  --bg:var(--surface); --card:var(--surface-raised); --soft:var(--surface-panel); --line:var(--hairline);
  --mut:var(--ink-muted); --teal:var(--brand); --teal-ink:var(--accent-text); --teal-bg:var(--status-good-tint);
  --good:var(--status-good); --good-bg:var(--status-good-tint); --warn:var(--status-warning); --warn-bg:var(--status-warning-tint);
  --bad:var(--status-poor); --bad-bg:var(--status-poor-tint); --info:var(--status-info); --info-bg:var(--status-info-tint);
  --font:var(--font-sans);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--surface);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}

/* AppShell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--hairline);padding:20px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:8px;padding:0 10px 14px}
.logo img{height:18px;width:auto}
.logo small{font:900 11px/16px var(--font-sans);letter-spacing:.2em;color:var(--ink-muted);text-transform:uppercase}
.cm-logo--on-dark{display:none}
:root[data-theme="dark"] .cm-logo--on-light{display:none}
:root[data-theme="dark"] .cm-logo--on-dark{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cm-logo--on-light{display:none}:root:not([data-theme="light"]) .cm-logo--on-dark{display:block}}
.grp{font:900 11px/16px var(--font-sans);letter-spacing:.25em;text-transform:uppercase;color:var(--ink-muted);padding:14px 10px 6px}
.nv{display:flex;align-items:center;gap:10px;border:0;border-left:3px solid transparent;background:none;text-align:left;min-height:40px;padding:8px 10px;border-radius:var(--radius-sm);width:100%;font-weight:700;color:var(--ink)}
.nv:hover{background:var(--surface-panel)}
.nv[aria-current="page"]{background:var(--status-good-tint);border-left-color:var(--brand);color:var(--ink)}
.nv svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nv .ct{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:var(--radius-pill);background:var(--surface-panel);color:var(--ink);font:700 12px/22px var(--font-sans);text-align:center}
.nv .ct.hot{background:var(--status-poor-tint);color:var(--status-poor)}
.main{min-width:0}
.top{display:flex;gap:12px;align-items:center;padding:14px 24px;border-bottom:1px solid var(--hairline);position:sticky;top:0;background:var(--surface);z-index:5;flex-wrap:wrap}
.top h1{font:900 20px/26px var(--font-sans);letter-spacing:-.02em;min-width:70px}
.search{flex:1;min-width:180px;max-width:480px;margin-left:auto;display:flex;align-items:center;gap:8px;border:1.5px solid var(--border-control);background:var(--surface-raised);border-radius:var(--radius-pill);padding:0 16px;min-height:40px;color:var(--ink-muted)}
.search input{border:0;background:none;flex:1;min-width:0;outline:none;min-height:36px;padding:0}
.search:focus-within{outline:2px solid var(--focus-ring);outline-offset:2px}

/* Buttons (cm-btn) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:var(--radius-pill);padding:8px 18px;font:700 13px/18px var(--font-sans);letter-spacing:.01em;white-space:nowrap}
.btn:hover{background:var(--surface-panel)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.dk{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.sm{min-height:32px;padding:5px 14px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-text)}
.btn.ghost:hover{background:var(--surface-panel)}
.btn.danger{color:var(--status-poor);border-color:var(--status-poor)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.menu{display:none}

/* Page */
.page{padding:24px 24px 56px;display:flex;flex-direction:column;gap:24px;min-width:0}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--status-warning-tint);color:var(--ink);border-radius:var(--radius-sm);padding:12px 16px;font-size:14px;line-height:20px}
.note.sample::before{content:"SAMPLE";flex:none;display:inline-flex;align-items:center;height:20px;padding:0 6px;border:1.5px solid var(--status-warning);border-radius:var(--radius-xs);color:var(--status-warning);font:900 10px/1 var(--font-sans);letter-spacing:.2em}
h2.pt{font:900 36px/40px var(--font-sans);letter-spacing:-.03em}
h2.pt::after{content:"";display:block;width:48px;height:var(--stroke-rule);background:var(--brand);margin-top:12px}
.sub{color:var(--ink-muted);margin-top:8px;font-size:16px;line-height:24px}
.head{display:flex;gap:12px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* MetricCard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface-raised);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:32px;line-height:36px;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.kpi .l{font:900 11px/16px var(--font-sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-muted);margin-top:4px}
.kpi .d{font-size:13px;line-height:18px;margin-top:6px;padding-top:8px;border-top:1px solid var(--hairline);color:var(--ink-muted)}
.kpi .d.bad{color:var(--status-poor)}.kpi .d.good{color:var(--status-good)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.cols.eq{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--surface-raised);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:20px;min-width:0}
.card h3{font:700 16px/22px var(--font-sans);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-weight:400;color:var(--ink-muted);font-size:13px}

/* DataTable */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:900 11px/16px var(--font-sans);text-transform:uppercase;letter-spacing:.2em;color:var(--ink-muted);text-align:left;padding:10px 12px;white-space:nowrap;border-bottom:2px solid var(--ink)}
td{padding:12px;border-bottom:1px solid var(--hairline);vertical-align:top}
td.nw{white-space:nowrap}
tr.r{cursor:pointer}
tr.r:hover td{background:var(--surface-panel)}
td small,.li small{display:block;color:var(--ink-muted);font-size:13px;line-height:18px}

/* ContentStatus pills and badges */
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;border-radius:var(--radius-pill);padding:0 10px;font:700 12px/1 var(--font-sans);background:var(--surface-panel);color:var(--ink);white-space:nowrap}
.tag.g,.tag.w,.tag.b,.tag.i,.tag.t{gap:6px}
.tag.g::before,.tag.w::before,.tag.b::before,.tag.i::before,.tag.t::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tag.g{background:var(--status-good-tint);color:var(--status-good)}.tag.w{background:var(--status-warning-tint);color:var(--status-warning)}.tag.b{background:var(--status-poor-tint);color:var(--status-poor)}.tag.i{background:var(--status-info-tint);color:var(--status-info)}.tag.t{background:var(--status-good-tint);color:var(--status-good)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;min-height:32px;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:var(--radius-pill);padding:0 14px;font:700 12px/16px var(--font-sans)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.on{background:var(--status-good-tint);border-color:var(--brand);color:var(--ink)}
.score{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.bar{width:48px;height:8px;background:var(--hairline);border-radius:var(--radius-pill);overflow:hidden}.bar i{display:block;height:100%;background:var(--status-dot-good)}
.bar.lo i{background:var(--status-dot-warning)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--hairline)}
.li:first-child{border-top:0}
.li .g{flex:1;min-width:0}
.av{width:32px;height:32px;border-radius:50%;background:var(--surface-inverse);color:var(--ink-inverse);display:grid;place-items:center;font:700 12px/1 var(--font-sans);flex:none}
.hb{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;gap:12px;align-items:center;margin:8px 0;font-size:14px}
.hb div{height:8px;background:var(--hairline);border-radius:var(--radius-pill);overflow:hidden}.hb div i{display:block;height:100%;background:var(--chart-1);border-radius:var(--radius-pill)}
.hb span:last-child{text-align:right;color:var(--ink-muted);font-variant-numeric:tabular-nums}

/* Pipeline board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(236px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.colm{background:var(--surface-panel);border-radius:var(--radius-sm);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.colm h4{font:900 11px/16px var(--font-sans);letter-spacing:.2em;text-transform:uppercase;margin:4px;display:flex;justify-content:space-between;gap:6px}
.colm h4 span{color:var(--ink-muted);font-weight:700;letter-spacing:0}
.deal{background:var(--surface-raised);border:1px solid var(--hairline);border-radius:var(--radius-sm);padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.deal:hover{border-color:var(--brand)}
.deal.drag{opacity:.4}
.deal b{font-weight:700}
.deal small{color:var(--ink-muted);font-size:13px}

/* FormField */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.w2{grid-column:span 2}
.fld.full{grid-column:1/-1}
.fld label,.lab{font:700 13px/18px var(--font-sans);color:var(--ink)}
.fld label i{color:var(--status-poor);font-style:normal}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=url],input[type=search]:not(.search input),select,textarea{width:100%;min-height:44px;border:1.5px solid var(--border-control);background:var(--surface-raised);color:var(--ink);border-radius:var(--radius-sm);padding:10px 12px;min-width:0}
.search input{border:0!important;min-height:36px!important;background:none!important}
textarea{min-height:88px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--ink-muted)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus-ring);outline-offset:1px}
.ck{display:flex;gap:8px;align-items:center;font-size:14px}
.ck input{width:18px;height:18px;accent-color:var(--accent-text)}
.formwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.sticky{position:sticky;top:74px;display:flex;flex-direction:column;gap:16px}
.big{font-size:44px;font-weight:900;letter-spacing:-.04em;line-height:1}

/* Drawer: flat, separated by a hairline and the scrim */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface-raised);border-left:1px solid var(--hairline);padding:24px;z-index:30;overflow:auto;display:flex;flex-direction:column;gap:16px}
.drawer h3{font:900 24px/30px var(--font-sans);letter-spacing:-.02em}
.scrim{position:fixed;inset:0;background:rgba(34,40,51,.55);z-index:29}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--ink-muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.sec{font:900 11px/16px var(--font-sans);letter-spacing:.25em;text-transform:uppercase;color:var(--accent-text);margin-top:8px}

/* RecordTimeline */
.tl{border-left:2px solid var(--hairline);margin:0 0 0 5px;padding:0 0 0 18px;display:flex;flex-direction:column;gap:12px;list-style:none;font-size:14px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--brand)}
.tl small{display:block;color:var(--ink-muted);font-size:13px}
.pre{background:var(--surface-inverse);color:var(--ink-inverse);border-radius:var(--radius-sm);padding:14px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto;white-space:pre}
.tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--hairline);padding-bottom:12px}

/* MessageThread */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{padding:10px 14px;border-radius:var(--radius-sm);max-width:680px;background:var(--surface-raised);border:1px solid var(--hairline)}
.msg.u{background:var(--status-good-tint);border-color:var(--status-good-tint);color:var(--ink);align-self:flex-end}
.msg.a{background:var(--surface-raised)}
.msg ul{margin:6px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-inverse);color:var(--ink-inverse);padding:12px 20px;border-radius:var(--radius-pill);z-index:60;font-size:14px;font-weight:700;max-width:90vw}
.pb h4{font:700 16px/22px var(--font-sans);margin-bottom:8px}
.pb ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.tpl{white-space:pre-wrap;background:var(--surface-panel);border-radius:var(--radius-xs);padding:12px 16px;font-size:14px;margin:8px 0}

/* ViewStates: empty */
.empty{padding:32px 24px;text-align:center;color:var(--ink-muted)}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;top:0;z-index:40;width:270px;transform:translateX(-100%);transition:transform .2s;border-right:1px solid var(--hairline)}
  .rail.open{transform:none}
  .menu{display:inline-flex}
  .cols,.cols.eq,.formwrap{grid-template-columns:minmax(0,1fr)}
  .sticky{position:static}
  .top,.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .search{margin-left:0;max-width:none;order:9;flex-basis:100%}
  .fld.w2{grid-column:auto}
  h2.pt{font-size:28px;line-height:32px}
}
@media (prefers-reduced-motion:reduce){.rail{transition:none}}
</style>

 if(k.includes('risk')){const r=S.accounts.filter(a=>a.health<60);return `<b>Accounts under 60:</b><ul>${r.map(a=>`<li>${esc(a.name)}, health ${a.health}. ${esc(a.risk)}</li>`).join('')}</ul>`}

 if(k.includes('next step')){const d=S.deals.filter(d=>d.stage<5&&!d.lost&&!d.nextStep);return d.length?`<b>No next step:</b><ul>${d.map(x=>`<li>${esc(x.business)} in ${STAGES[x.stage]}.</li>`).join('')}</ul>`:'Every open deal has a next step.'}
 if(k.includes('draft')||k.includes('reply')){const l=[...S.leads].sort((a,b)=>b.created-a.created)[0];return `<b>Draft for ${esc(l.business)}:</b><div class="tpl">${esc(replyDraft(l))}</div><small>Review and edit before sending.</small>`}

function vQuotes(){
 return sample+head('Quotes','Every client gets a custom quote after discovery. Values here are internal and never shown to clients.')+

 <div class="card"><div class="tw"><table><thead><tr><th>Business</th><th>Services in scope</th><th>Internal value</th><th>Status</th><th>Follow up</th><th></th></tr></thead><tbody>${S.quotes.map(q=>`<tr><td><b>${esc(q.business)}</b></td><td>${q.services.map(s=>tag(s)).join(' ')}</td><td>${money(q.value)}</td><td>${tag(q.status,q.status==='Accepted'?'g':q.status==='Sent'?'i':'w')}</td><td class="nw">${q.followUp?(q.followUp<dOff(0)?tag('Overdue '+fmtD(q.followUp),'b'):fmtD(q.followUp)):'None'}</td><td class="nw">${q.status==='Draft'?`<button class="btn sm pri" data-a="qsend" data-id="${q.id}">Mark sent</button>`:q.status==='Sent'?`<button class="btn sm" data-a="qwin" data-id="${q.id}">Mark accepted</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="card"><h3>Before a quote goes out</h3><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px"><li>Built from the consult, in the owner's own words for goals and problems.</li><li>Services scoped one by one, with the Campaign Record named as included.</li><li>Ad accounts and analytics stay in the client name.</li><li>90 day sprint explained, with no lock in beyond it.</li><li>Sent within ${S.settings.quoteDays} business days of the consult, with a follow up date set.</li></ul></div>`;
}

/* ===== Reports ===== */
function pct(a,b){return b?Math.round(a/b*100)+'%':'No data'}
function vReports(){
 const L=S.leads,D=S.deals;
 const touched=L.filter(l=>l.firstTouch),avgH=touched.length?Math.round(sum(touched,l=>(l.firstTouch-l.created)/H)/touched.length):0;
 const audited=L.filter(l=>l.auditSent||l.status==='Audit sent'||l.status==='Consult booked').length;
 const consult=D.filter(d=>d.stage>=3).length,quoted=D.filter(d=>d.stage>=4).length,won=D.filter(d=>d.stage===5).length,lost=D.filter(d=>d.lost).length;
 const src=SOURCES.map(s=>{const ls=L.filter(l=>l.source===s);return [s,ls.length,ls.filter(l=>['Consult booked','Converted'].includes(l.status)||S.deals.some(d=>d.leadId===l.id&&d.stage>=3)).length,ls.length?Math.round(sum(ls,score)/ls.length):0]}).filter(r=>r[1]);
 const seg={};L.forEach(l=>{const k=segShort(l.segment);seg[k]=(seg[k]||0)+1});
 const mx=Math.max(1,...Object.values(seg));
 return sample+head('Reports','Funnel, speed, and source quality, calculated from the records here.')+
 `<div class="kpis"><div class="kpi"><div class="v">${avgH} h</div><div class="l">Average time to first reply</div><div class="d ${avgH>S.settings.replyHours?'bad':'good'}">Target ${S.settings.replyHours} h</div></div>
 <div class="kpi"><div class="v">${pct(audited,L.length)}</div><div class="l">Leads that got an audit</div></div>
 <div class="kpi"><div class="v">${pct(consult,D.length)}</div><div class="l">Deals that reached a consult</div></div>
 <div class="kpi"><div class="v">${pct(won,won+lost+D.filter(d=>d.stage>=4&&d.stage<5).length)}</div><div class="l">Quote to win rate</div><div class="d">Early data, small sample</div></div></div>
 <div class="cols eq"><div class="card"><h3>Funnel</h3>${[['Leads',L.length],['Audit sent',audited],['Consult booked',consult],['Quote sent',quoted],['Won',won]].map(([k,v])=>`<div class="hb"><span>${k}</span><div><i style="width:${v/Math.max(1,L.length)*100}%"></i></div><span>${v}</span></div>`).join('')}</div>
 <div class="card"><h3>Business types <small>Leads</small></h3>${Object.entries(seg).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="hb"><span>${esc(k)}</span><div><i style="width:${v/mx*100}%"></i></div><span>${v}</span></div>`).join('')}</div></div>
 <div class="card"><h3>Source quality</h3><div class="tw"><table><thead><tr><th>Source</th><th>Leads</th><th>Reached consult</th><th>Average fit score</th></tr></thead><tbody>${src.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${r[1]}</td><td>${r[2]} (${pct(r[2],r[1])})</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div><p class="sub" style="margin-top:8px">Sample sizes are small. Treat these as early signals, not conclusions.</p></div>`;
}

const PB={
 'Sales motion':()=>`<div class="pb cols eq"><div class="card"><h4>How a deal moves</h4><ul>
  <li><b>Capture.</b> Website form, free audit page, tool hub, referral, or the outreach agent.</li>
  <li><b>Reply.</b> First reply inside ${S.settings.replyHours} hours. Fill in business type, budget, and decision maker.</li>
  <li><b>Audit.</b> Website, social, local search, and ads scored. Written summary inside ${S.settings.auditDays} business days.</li>
  <li><b>Consult.</b> A short call walks through the audit and confirms goals.</li>
  <li><b>Custom quote.</b> Built from the consult, sent inside ${S.settings.quoteDays} business days.</li>
  <li><b>Kickoff.</b> 90 day sprint. Campaign Record opens with the brief and goal.</li>
  <li><b>Run.</b> Weekly optimization, monthly report by the 7th, quarterly strategy review.</li>
  <li><b>Grow.</b> Add email and SMS, tracking upgrades, or a campaign sprint for the next moment.</li></ul></div>
  <div class="card"><h4>Rules of the motion</h4><ul><li>Every price is custom and internal. Share scope, not a price list.</li><li>Never promise results. Promise tracking, a record, and plain reporting.</li><li>Ad accounts and analytics stay in the client name.</li><li>No client name, logo, or result is used without written approval. Sample work is labeled SAMPLE.</li><li>Reply to audit requests first. They asked for the next step.</li></ul>
  <h4 style="margin-top:14px">Targets</h4><ul><li>First reply: ${S.settings.replyHours} hours</li><li>Audit delivered: ${S.settings.auditDays} business days</li><li>Quote after consult: ${S.settings.quoteDays} business days</li></ul><small class="sub">Change targets in Settings.</small></div></div>`,
 'Qualify':()=>`<div class="pb cols eq"><div class="card"><h4>Good fit signs</h4><ul><li>Local business with a real customer base and a way to book, call, or order.</li><li>Already spends on ads, or ready to start with a monthly ad budget.</li><li>The owner or a decision maker joins the audit review call.</li><li>Wants tracking and a written record, not just more clicks.</li><li>Open to ad accounts in their own name.</li></ul></div>
  <div class="card"><h4>Pause or decline</h4><ul><li>Wants guaranteed results or a promised revenue number.</li><li>No budget for ads and no website, with no plan to build either.</li><li>Wants the agency to own the ad account.</li><li>Needs a one off task, not a campaign or a sprint.</li><li>Decision maker will not join any call.</li></ul></div>
  <div class="card full"><h4>Five things to know before a quote</h4><ul><li><b>Need.</b> What they are trying to fix or build, in their words.</li><li><b>Budget.</b> Monthly ad budget range and what they spend today.</li><li><b>Authority.</b> Who decides, and who else weighs in.</li><li><b>Timing.</b> When they want to start and why then.</li><li><b>Tracking.</b> What is measured today: calls, forms, bookings, orders.</li></ul></div></div>`,
 'Discovery questions':()=>{const Q={'Service businesses':['How many calls come in each week, and how many are answered?','Which jobs make the most money?','Where do calls come from today?','What happens to a missed call?','Which areas do you serve?'],'Restaurants and food':['Where do reservations and orders come from today?','Do you use delivery apps, and what do they cost you?','Which days and hours are slow?','What POS do you use?','How do you bring guests back?'],'Beauty and clinics':['How do clients book today?','What is your no show rate?','How many new clients per month do you want?','What do reviews say about you?','Which services do you most want to fill?'],'Local retail and brands':['Is the goal foot traffic, online orders, or both?','What are your busiest seasons?','Do you have an email or text list?','Which products carry the best margin?','What did past promotions bring in?']};
  return `<div class="pb cols eq">${Object.entries(Q).map(([k,v])=>`<div class="card"><h4>${k}</h4><ul>${v.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}<div class="card full"><h4>Every call</h4><ul><li>What are you trying to fix or build?</li><li>What campaigns have or have not worked before?</li><li>What assets do you already have: site, listing, photos, list?</li><li>How do you know a customer came from an ad today?</li></ul></div></div>`},
 'Call scripts':()=>`<div class="pb cols eq"><div class="card"><h4>Audit review call, 30 minutes</h4><ul><li><b>2 min.</b> Open. Confirm who is on the call and what they hope to learn.</li><li><b>8 min.</b> Walk the scorecard: website, social, local search, ads. Show what is broken, missing, or costing money.</li><li><b>8 min.</b> Pick the top three fixes and what each one changes.</li><li><b>5 min.</b> Explain how we run it: Discovery, Strategy, Execution, Insights, with a Campaign Record for every campaign.</li><li><b>5 min.</b> Agree the next step and book it before the call ends.</li><li><b>2 min.</b> Confirm the recap email and who else should see it.</li></ul></div>
  <div class="card"><h4>Discovery call, 30 to 45 minutes</h4><ul><li><b>5 min.</b> Business background and the goal for the next 90 days.</li><li><b>10 min.</b> Customers, offers, and what has been tried.</li><li><b>10 min.</b> Tracking and tools today. Who owns the ad accounts?</li><li><b>5 min.</b> Budget range, decision makers, and timing.</li><li><b>5 min.</b> Explain the quote process and set a date to send it.</li></ul></div></div>`,
 'Objections':()=>{const O=[['How much does it cost?','They need a number to decide.','Every plan is quoted after discovery because scope depends on goals and ad budget. Start, Grow, and Plus give a sense of scope.','Plans page','What monthly ad budget feels comfortable?'],['We already have a freelancer or agency.','Fear of switching or hurting a relationship.','The free audit is a second opinion. Keep what works. We show where tracking or reporting is thin.','Free audit','Can I see what they report to you each month?'],['Ads did not work before.','A bad past experience, often with weak tracking.','Most failures trace back to missing tracking. The audit shows what was measured and what was not.','Audit scorecard','What did you track last time?'],['I do not have time.','Owners are busy running the business.','We handle setup. You join a discovery call, approve work in the portal, and read one monthly report.','Process page','What is the best weekly time for a short check in?'],['I do not want to be locked in.','Fear of losing accounts and data.','Ad accounts stay in your name, and you can leave with your data and your record. The first commitment is one 90 day sprint.','Plans page note','Would you like to see the Campaign Record format?'],['My budget is small.','Unsure ads are worth it at their size.','Start where it counts most: tracking, your Google profile, then a focused campaign. Scope can be sized to the budget.','Services page','What result would make the first 90 days a success?'],['I need to talk to my partner.','Decision is shared.','Invite them to the audit review call and send a one page recap they can forward.','Recap email','Who else should I include?'],['How do I know it works?','Wants proof before paying.','Every campaign gets tracking by source, weekly numbers, and a written record of what changed and why. Sample work is labeled SAMPLE.','Campaign Record','Which number would you trust most?']];
  return `<div class="card"><div class="tw"><table><thead><tr><th>They say</th><th>What it usually means</th><th>Response</th><th>Proof</th><th>Ask next</th></tr></thead><tbody>${O.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' class="nw"':''}>${i===0?'<b>'+c+'</b>':c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`},
 'Email templates':()=>{const T=[['Audit delivered',`Subject: Your free marketing audit for {business}\n\nHi {first_name},\n\nYour audit is attached. It scores your website, social, local search, and ads, and lists the three fixes that matter most.\n\nIf a 20 minute walkthrough helps, book a time here: https://meetings-na2.hubspot.com/content-matter\n\nTalk soon,\nContentMatter`],['Day two follow up',`Subject: Did the audit raise any questions?\n\nHi {first_name},\n\nChecking that the audit for {business} reached you. The tracking section is usually the most useful place to start. Happy to walk through it.\n\nContentMatter`],['After the consult',`Subject: Recap and next step for {business}\n\nHi {first_name},\n\nThanks for the time today. What I heard: {goal}. What we will scope: {services}. I will send a custom quote by {date}.\n\nContentMatter`],['Quote sent',`Subject: Your custom quote for {business}\n\nHi {first_name},\n\nYour quote is attached. It covers {services}, a Campaign Record for every campaign, and a monthly report by the 7th. Ad accounts stay in your name.\n\nWant to walk through it together this week?\n\nContentMatter`],['Gentle nudge',`Subject: Still want to move forward, {first_name}?\n\nHi {first_name},\n\nWanted to check in on the quote for {business}. Tell me what is holding things up and I can adjust the scope.\n\nContentMatter`]];
  return `<div class="cols eq">${T.map(([t,b],i)=>`<div class="card"><h3>${t} <button class="btn sm" data-a="copytpl" data-i="${i}">Copy</button></h3><div class="tpl" id="tpl${i}">${esc(b)}</div></div>`).join('')}</div>`},
 'Services guide':()=>`<div class="card"><div class="tw"><table><thead><tr><th>Service</th><th>What it covers</th><th>Good fit when</th></tr></thead><tbody>
 <tr><td><b>Local SEO and AI search</b></td><td>Maps ranking, local keywords, on page fixes, listings, AI search visibility</td><td>Customers search near them and the business is hard to find</td></tr>
 <tr><td><b>Google Business Profile and reviews</b></td><td>Profile and Yelp setup, review generation, review replies, photos and hours</td><td>Few or weak reviews, or an incomplete listing</td></tr>
 <tr><td><b>Google, Meta, and Yelp ads</b></td><td>Search, Performance Max, local and social campaigns managed weekly</td><td>Has a budget and wants bookings, calls, or orders</td></tr>
 <tr><td><b>Websites and landing pages</b></td><td>One week launch page or full build, wired for tracking, with CRO and testing</td><td>Slow or unclear site, or a campaign needs a page</td></tr>
 <tr><td><b>GA4 and conversion tracking</b></td><td>GA4, Tag Manager, call and form tracking by source, attribution</td><td>Cannot say which ads bring customers</td></tr>
 <tr><td><b>Email and SMS automation</b></td><td>Welcome, reactivation, repeat visit flows, monthly campaigns</td><td>Has a customer list that is not being used</td></tr>
 <tr><td><b>Campaign sprints and Paid Ads Launch</b></td><td>Two to three week push for a grand opening, launch night, new menu, or season, or a Paid Ads Launch with a 30 day readout</td><td>A specific moment with a date</td></tr>
 <tr><td><b>Restaurant and food add ons</b></td><td>Guest retention, POS marketing setup, delivery app launch and management</td><td>Restaurants and food brands</td></tr>
 <tr><td><b>Campaign Record</b></td><td>Written record of every campaign, included with every engagement</td><td>Always. Lead with it.</td></tr></tbody></table></div></div>`
};

/* ===== Actions and boot ===== */
function render(){renderNav();$('#title').textContent=TITLES[view]||'';$('#page').innerHTML=VIEWS[view]();$('#rail').classList.remove('open');if(view==='newlead')liveUpdate()}
function go(v){view=v;filter='All';if(v!=='newlead'){draft=null;editId=null}closeDrawer();try{if(v!=='newlead')history.replaceState(null,'','#'+v)}catch(e){}render();window.scrollTo(0,0)}
function logLead(l,x){l.log.push({t:now(),x})}
function addTask(title,due,rel,owner){S.tasks.push({id:nid(),title,due,done:false,rel,owner:owner||'You'})}
function createLeadFrom(d,src){
 const l=Object.assign({id:nid(),created:now(),log:[],firstTouch:null,auditRequested:false},d);
 l.log.push({t:now(),x:src||'Lead created'});
 S.leads.push(l);return l;
}
function makeDeal(l){
 const map={'New':0,'Contacted':0,'Audit in progress':1,'Audit sent':2,'Consult booked':3,'Nurture':0};
 const dl={id:nid(),leadId:l.id,business:l.business,contact:fullName(l),stage:map[l.status]??0,services:l.services||[],plan:l.planInterest&&l.planInterest!=='Not sure'?l.planInterest:'',value:null,owner:l.owner||'You',checks:{},stageSince:now(),lost:false,notes:'',nextStep:l.nextStep||'',nextDate:l.nextDate||null};
 S.deals.push(dl);l.status='Converted';logLead(l,'Deal created in '+STAGES[dl.stage]);return dl;
}
function setDealStage(d,s){
 d.stage=s;d.stageSince=now();
 if(s===5&&!S.accounts.some(a=>a.name===d.business)){
  S.accounts.push({id:nid(),name:d.business,contact:d.contact,segment:(lead(d.leadId)||{}).segment||'',plan:d.plan||'Local Start',status:'Onboarding',health:80,adSpend:0,lead:d.owner,renewal:now()+90*DAY,portal:0,inClientName:true,since:now(),lastReport:null,risk:''});
  addTask('Book kickoff and send portal invite for '+d.business,dOff(1),'Account',d.owner);
  toast('Won. Account created and kickoff task added.');
 }else toast('Moved to '+STAGES[s]);
 save();
}
function setPath(path,val){
 const [col,id,key]=path.split(':');
 if(col==='settings'){S.settings[key]=Math.max(1,+val||1);return}
 const o=S[col].find(x=>x.id===+id);if(!o)return;
 if(key.includes('.')){const [a,b]=key.split('.');o[a]=o[a]||{};o[a][b]=val===''?null:+val;return}
 o[key]=val;
}

const A={
 go:el=>go(el.dataset.v),
 close:()=>closeDrawer(),
 filter:el=>{filter=el.dataset.f;render()},
 owner:el=>{ownerF=el.dataset.o;render()},
 tab:el=>{tab=el.dataset.k;render()},
 tf:el=>{tf=el.dataset.f;render()},
 lead:el=>leadDrawer(+el.dataset.id),
 deal:el=>{if(el.classList.contains('deal')&&el.dataset.dragged)return;dealDrawer(+el.dataset.id)},
 account:el=>accountDrawer(+el.dataset.id),
 newlead:()=>{draft=newDraft();editId=null;view='newlead';closeDrawer();render();window.scrollTo(0,0)},
 edit:el=>{const l=lead(+el.dataset.id);draft=JSON.parse(JSON.stringify(l));editId=l.id;view='newlead';closeDrawer();render();window.scrollTo(0,0)},
 multi:el=>{const k=el.dataset.k,o=el.dataset.o;const a=draft[k]=draft[k]||[];const i=a.indexOf(o);i>=0?a.splice(i,1):a.push(o);el.classList.toggle('on');liveUpdate()},
 savelead:el=>{
  const d=draft;const err=$('#formErr');
  if(!d.first||!d.business){err.textContent='Add a first name and a business name.';err.style.color='var(--bad)';return}
  if(!d.email&&!d.phone){err.textContent='Add an email or a phone number so you can reach them.';err.style.color='var(--bad)';return}
  let l;
  if(editId){l=lead(editId);Object.assign(l,d);logLead(l,'Record updated')}
  else{l=createLeadFrom(Object.assign({},d,{auditRequested:false}),'Built manually in the dashboard');if(d.nextStep&&d.nextDate)addTask(d.nextStep+' for '+d.business,d.nextDate,'Lead',d.owner)}
  let dl=null;if(el.dataset.deal&&!S.deals.find(x=>x.leadId===l.id))dl=makeDeal(l);
  save();toast(dl?'Lead saved and deal created':'Lead saved');draft=null;editId=null;view=dl?'deals':'leads';render();window.scrollTo(0,0);
 },
 touch:el=>{const l=lead(+el.dataset.id);l.firstTouch=now();if(l.status==='New')l.status='Contacted';logLead(l,'First reply sent');save();toast('First reply logged');leadDrawer(l.id);render()},
 draft:el=>copy(replyDraft(lead(+el.dataset.id)),'Reply draft copied'),
 startaudit:el=>{const l=lead(+el.dataset.id);l.status='Audit in progress';l.auditRequested=true;l.audit=l.audit||{};logLead(l,'Audit started');save();toast('Added to Audits');leadDrawer(l.id);render()},
 convert:el=>{const l=lead(+el.dataset.id);const d=makeDeal(l);save();toast('Deal created in '+STAGES[d.stage]);closeDrawer();render()},
 lstatus:el=>{const l=lead(+el.dataset.id);l.status=el.dataset.s;logLead(l,'Status set to '+el.dataset.s);save();toast('Lead moved to '+el.dataset.s);closeDrawer();render()},
 chk:el=>{const d=S.deals.find(x=>x.id===+el.dataset.id);d.checks[el.dataset.k]=el.checked;save()},
 advance:el=>{const d=S.deals.find(x=>x.id===+el.dataset.id);setDealStage(d,d.stage+1);dealDrawer(d.id);render()},
 mkquote:el=>{const d=S.deals.find(x=>x.id===+el.dataset.id);S.quotes.push({id:nid(),dealId:d.id,business:d.business,services:d.services,value:d.value,status:'Draft',sent:null,followUp:null});addTask('Build custom quote for '+d.business,addBiz(now(),S.settings.quoteDays),'Deal',d.owner);save();toast('Quote draft started');dealDrawer(d.id);render()},
 addtask:el=>{const d=S.deals.find(x=>x.id===+el.dataset.id);addTask('Follow up with '+d.business,dOff(2),'Deal',d.owner);save();toast('Task added');render()},
 acctask:el=>{const a=S.accounts.find(x=>x.id===+el.dataset.id);addTask('Check in with '+a.name,dOff(2),'Account',a.lead);save();toast('Task added');renderNav()},
 lose:el=>{const d=S.deals.find(x=>x.id===+el.dataset.id);d.lost=true;save();toast(d.business+' marked lost');closeDrawer();render()},
 rec:el=>{const c=S.campaigns.find(x=>x.id===+el.dataset.id);c.rec[el.dataset.k]=!c.rec[el.dataset.k];if(el.dataset.k==='weekly'&&c.rec.weekly)c.lastWeekly=now();save();render()},
 done:el=>{const t=S.tasks.find(x=>x.id===+el.dataset.id);t.done=el.checked;save();render()},
 oappr:el=>{S.outreach.find(x=>x.id===+el.dataset.id).status='approved';save();toast('Approved. The agent will send on schedule.');render()},
 oskip:el=>{S.outreach.find(x=>x.id===+el.dataset.id).status='skipped';save();toast('Skipped');render()},
 oreply:el=>{const o=S.outreach.find(x=>x.id===+el.dataset.id);o.status='replied';const nm=o.to.split(' ');const l=createLeadFrom({first:nm[0],last:nm.slice(1).join(' '),business:o.biz,source:'Outreach agent',status:'New',segment:SEGMENTS.find(s=>s.startsWith(o.seg.split(' ')[0]))||'',owner:'You',services:[],platforms:[],tracking:[],consentEmail:true,sourceDetail:o.channel+' outreach'},'Replied to an outreach '+o.channel);addTask('Reply to '+o.to+' at '+o.biz,dOff(0),'Lead','You');save();toast('Lead created from the reply');render()},
 asent:el=>{const l=lead(+el.dataset.id);l.auditSent=now();l.status='Audit sent';logLead(l,'Audit emailed');const d=S.deals.find(x=>x.leadId===l.id);if(d&&d.stage<2)setDealStage(d,2);addTask('Follow up on the audit for '+l.business,addBiz(now(),2),'Lead',l.owner);save();toast('Audit marked sent. Follow up task added.');render()},
 qsend:el=>{const q=S.quotes.find(x=>x.id===+el.dataset.id);q.status='Sent';q.sent=now();q.followUp=addBiz(now(),3);const d=S.deals.find(x=>x.id===q.dealId);if(d&&d.stage<4)setDealStage(d,4);save();toast('Quote marked sent');render()},
 qwin:el=>{const q=S.quotes.find(x=>x.id===+el.dataset.id);q.status='Accepted';q.followUp=null;const d=S.deals.find(x=>x.id===q.dealId);if(d&&d.stage<5)setDealStage(d,5);save();render()},
 ask:el=>{const q=el.dataset.q;S.ai.push({q,a:answer(q)});save();render()},
 copysnip:()=>copy($('#snip').textContent,'Form markup copied'),
 copytpl:el=>copy($('#tpl'+el.dataset.i).textContent,'Template copied'),
 export:()=>copy(JSON.stringify(S,null,2),'Data copied as JSON'),
 reset:()=>{Store.reset();S=seed();save();toast('Sample data restored');render()}
};

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(f){if(t.tagName==='BUTTON'||t.tagName==='A')e.preventDefault();f(t,e)}});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.matches('[data-i]')){draft[t.dataset.i]=t.type==='checkbox'?t.checked:t.dataset.i==='nextDate'?fromIn(t.value):(t.type==='number'&&t.value!==''?+t.value:t.value);liveUpdate();return}
 if(t.matches('[data-s]')){setPath(t.dataset.s,t.dataset.t==='date'?fromIn(t.value):t.value);save();if(t.dataset.s.startsWith('settings')||t.dataset.s.startsWith('leads'))render();else renderNav()}
});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-i]')&&t.type!=='checkbox'&&t.tagName!=='SELECT'){draft[t.dataset.i]=t.type==='number'&&t.value!==''?+t.value:t.dataset.i==='nextDate'?fromIn(t.value):t.value;liveUpdate()}});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target;
 if(f.id==='wf'){
  const name=$('#w_name').value.trim().split(/\s+/);
  const l=createLeadFrom({first:name[0],last:name.slice(1).join(' '),business:$('#w_biz').value.trim(),zip:$('#w_zip').value.trim(),email:$('#w_email').value.trim(),phone:$('#w_phone').value.trim(),source:'Website form',status:'New',owner:'You',services:[],platforms:[],tracking:[],consentEmail:true,auditRequested:true,sourceDetail:'Website lead form'},'Submitted the website form and asked for a free audit');
  addTask('Reply to '+fullName(l)+' at '+l.business,now()+S.settings.replyHours*H,'Lead','You');
  save();renderNav();toast('Test lead created. Open Leads to see it.');
 }
 if(f.id==='tform'){const t=$('#tt').value.trim();if(!t)return;addTask(t,fromIn($('#td').value)||dOff(1),'General',$('#to').value);save();render()}
 if(f.id==='askf'){const q=$('#askq').value.trim();if(!q)return;S.ai.push({q,a:answer(q)});save();render()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){Q=e.target.value.toLowerCase();if(Q&&!['leads','deals','accounts','contacts'].includes(view))view='leads';render();const i=$('#q');i.focus()}});
$('#menu').onclick=()=>$('#rail').classList.toggle('open');
$('#theme').onclick=()=>{const r=document.documentElement,dk=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=dk?'light':'dark';try{localStorage.setItem('cm_theme',r.dataset.theme)}catch(e){}};
try{const th=localStorage.getItem('cm_theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

/* drag and drop for deals */
let dragId=null;
document.addEventListener('dragstart',e=>{const d=e.target.closest('.deal');if(d){dragId=+d.dataset.id;d.classList.add('drag')}});
document.addEventListener('dragover',e=>{if(e.target.closest('.colm'))e.preventDefault()});
document.addEventListener('drop',e=>{const c=e.target.closest('.colm');if(c&&dragId!==null){e.preventDefault();const d=S.deals.find(x=>x.id===dragId);const s=+c.dataset.stage;dragId=null;if(d&&d.stage!==s){setDealStage(d,s);render()}}});
document.addEventListener('dragend',()=>{dragId=null;$$('.drag').forEach(x=>x.classList.remove('drag'))});

S=Store.load()||seed();
const h0=(location.hash||'').slice(1);if(VIEWS[h0]&&h0!=='newlead')view=h0;
render();
window.addEventListener('hashchange',()=>{const x=location.hash.slice(1);if(VIEWS[x]&&x!==view&&x!=='newlead')go(x)});

})();
</script>

</body></html>
